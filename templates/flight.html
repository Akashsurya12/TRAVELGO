<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Flights - TravelGo</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <style>
    body {
      background: #f3f8ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #004aad;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
      transition: color 0.3s;
    }

    header nav a:hover {
      color: #ffdd57;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      color: #004aad;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 600;
    }

    .search-form {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .search-form select, .search-form input {
      flex: 1 1 160px;
      padding: 10px 14px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .search-btn {
      background-color: #004aad;
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .search-btn:hover {
      background-color: #00307c;
    }

    .flight-card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      background: #f9fbff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .flight-info {
      flex: 3;
      min-width: 250px;
    }

    .flight-info h4 {
      margin: 0 0 6px 0;
      color: #004aad;
    }

    .flight-info p {
      margin: 3px 0;
      color: #555;
      font-size: 14px;
    }

    .price-info {
      flex: 1;
      text-align: right;
      min-width: 160px;
    }

    .flight-price {
      font-size: 18px;
      font-weight: bold;
      color: #28a745;
      margin-bottom: 8px;
    }

    .book-btn {
      background: #28a745;
      color: white;
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .book-btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <header>
    <h1><i class="fas fa-plane-departure"></i> TravelGo</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>

  <main class="container">
    <h2>✈️ Search & Book Flights</h2>

    <form id="searchForm" class="search-form" onsubmit="event.preventDefault(); filterFlights();">
      <select id="source" required>
        <option value="">From</option>
        <option value="Hyderabad">Hyderabad</option>
        <option value="Bengaluru">Bengaluru</option>
        <option value="Chennai">Chennai</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Delhi">Delhi</option>
      </select>

      <select id="destination" required>
        <option value="">To</option>
        <option value="Delhi">Delhi</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Bengaluru">Bengaluru</option>
        <option value="Chennai">Chennai</option>
        <option value="Hyderabad">Hyderabad</option>
      </select>

      <input type="date" id="date" required />
      <input type="number" id="numPersons" min="1" value="1" placeholder="Passengers" required />
      <button type="submit" id="search-btn" class="search-btn">
        <i class="fas fa-search"></i> Search Flights
      </button>
    </form>

    <div id="flight-list"></div>
  </main>

  <script>
    const flights = [
      { id: 'FLT001', airline: 'IndiGo', number: '6E-234', source: 'Hyderabad', dest: 'Mumbai', depart: '08:00 AM', arrive: '09:30 AM', price: 3500 },
      { id: 'FLT002', airline: 'Vistara', number: 'UK-876', source: 'Bengaluru', dest: 'Delhi', depart: '12:00 PM', arrive: '02:45 PM', price: 4500 },
      { id: 'FLT003', airline: 'Air India', number: 'AI-543', source: 'Chennai', dest: 'Hyderabad', depart: '06:00 AM', arrive: '07:20 AM', price: 2800 },
      { id: 'FLT004', airline: 'SpiceJet', number: 'SG-123', source: 'Mumbai', dest: 'Bengaluru', depart: '06:00 PM', arrive: '07:30 PM', price: 3200 },
      { id: 'FLT005', airline: 'IndiGo', number: '6E-512', source: 'Hyderabad', dest: 'Delhi', depart: '07:30 AM', arrive: '09:45 AM', price: 4200 },
      { id: 'FLT006', airline: 'Air India', number: 'AI-840', source: 'Delhi', dest: 'Mumbai', depart: '10:00 AM', arrive: '12:15 PM', price: 4000 },
      { id: 'FLT007', airline: 'Vistara', number: 'UK-921', source: 'Hyderabad', dest: 'Bengaluru', depart: '09:15 AM', arrive: '10:25 AM', price: 2600 },
      { id: 'FLT008', airline: 'SpiceJet', number: 'SG-456', source: 'Bengaluru', dest: 'Chennai', depart: '02:30 PM', arrive: '03:30 PM', price: 2200 },
      { id: 'FLT009', airline: 'Air India', number: 'AI-602', source: 'Mumbai', dest: 'Delhi', depart: '04:00 PM', arrive: '06:15 PM', price: 4100 },
      { id: 'FLT010', airline: 'IndiGo', number: '6E-789', source: 'Delhi', dest: 'Hyderabad', depart: '05:30 PM', arrive: '07:45 PM', price: 4300 },
      { id: 'FLT011', airline: 'Vistara', number: 'UK-803', source: 'Chennai', dest: 'Delhi', depart: '11:00 AM', arrive: '01:50 PM', price: 4800 },
      { id: 'FLT012', airline: 'IndiGo', number: '6E-341', source: 'Bengaluru', dest: 'Hyderabad', depart: '07:00 PM', arrive: '08:10 PM', price: 2500 }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("date").value = today;
    });

    function filterFlights() {
      const src = document.getElementById('source').value;
      const dst = document.getElementById('destination').value;
      const date = document.getElementById('date').value;
      const pax = parseInt(document.getElementById('numPersons').value) || 1;
      const list = document.getElementById('flight-list');
      list.innerHTML = '';

      if (!src || !dst || !date) return;

      const filtered = flights.filter(f => 
        f.source.toLowerCase() === src.toLowerCase() && 
        f.dest.toLowerCase() === dst.toLowerCase()
      );

      filtered.forEach(f => {
        const card = document.createElement('div');
        card.className = 'flight-card';
        card.innerHTML = `
          <div class="flight-info">
            <h4>${f.airline} (${f.number})</h4>
            <p><strong>Route:</strong> ${f.source} → ${f.dest}</p>
            <p><strong>Departure:</strong> ${f.depart} | <strong>Arrival:</strong> ${f.arrive}</p>
            <p><strong>Travel Date:</strong> ${date}</p>
            <p><strong>Fare:</strong> ₹${f.price} per person</p>
          </div>
          <div class="price-info">
            <div class="flight-price">Total: ₹${f.price * pax}</div>
            <button class="book-btn"
              onclick="confirmFlight('${f.id}','${f.airline}','${f.number}','${f.source}','${f.dest}','${f.depart}','${f.arrive}','${date}',${pax},${f.price})">
              Book Now
            </button>
          </div>
        `;
        list.appendChild(card);
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="alert alert-warning text-center">No flights found for this route. Please try another combination (e.g. Hyderabad to Mumbai, Bengaluru to Delhi, Delhi to Mumbai).</div>`;
      }
    }

    function confirmFlight(id, airline, number, src, dst, depart, arrive, date, pax, price) {
      const url = `/confirm_flight_details?flight_id=${encodeURIComponent(id)}&airline=${encodeURIComponent(airline)}&flight_number=${encodeURIComponent(number)}&source=${encodeURIComponent(src)}&destination=${encodeURIComponent(dst)}&departure=${encodeURIComponent(depart)}&arrival=${encodeURIComponent(arrive)}&date=${encodeURIComponent(date)}&passengers=${pax}&price=${price}`;
      window.location.href = url;
    }
  </script>
</body>
</html>
